name: Build and Convert MRS Rules

# 触发条件：推送到 main 分支，手动触发，或者每天 3 次定时触发 (近似 10 小时一次)
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0,10,20 * * *'

jobs:
  build-mrs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install mihomo core
        run: |
            # 使用 jq 自动获取官方最新 release 的版本号
            LATEST_VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
            echo "获取到最新版本: $LATEST_VERSION"
            
            # 下载最新版内核
            wget -O mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_VERSION}/mihomo-linux-amd64-${LATEST_VERSION}.gz"
            
            # 解压、赋权并移动到系统路径
            gunzip mihomo.gz
            chmod +x mihomo
            sudo mv mihomo /usr/local/bin/
            
            # 验证安装是否成功
            mihomo -v

      - name: Run conversion script
        run: python build_mrs.py

      - name: Commit and push generated MRS files
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 暂存生成的规则文件夹和 README 文件
          git add mrs_rules_sp/ README.md
          
          # 打印当前 git 状态，方便在日志中调试排查变动
          git status
          
          # 执行提交，若无变化则静默退出避免任务报错
          git commit -m "Auto-generate MRS rules via mihomo" || exit 0
          
          # 推送至仓库
          git push
