name: Build and Convert MRS Rules

# 触发条件：推送到 main 分支时，或者手动在 Actions 页面触发
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mrs:
    runs-on: ubuntu-latest
    # 必须赋予 GITHUB_TOKEN 写权限，否则无法将生成的文件 push 回仓库
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install mihomo core
        run: |
            # 1. 使用 jq 获取官方最新 release 的版本号
            LATEST_VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
            echo "获取到最新版本: $LATEST_VERSION"
            
            # 2. 拼接正确的下载链接并下载
            wget -O mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_VERSION}/mihomo-linux-amd64-${LATEST_VERSION}.gz"
            
            # 3. 解压并安装
            gunzip mihomo.gz
            chmod +x mihomo
            sudo mv mihomo /usr/local/bin/
            
            # 4. 验证安装
            mihomo -v

      - name: Run conversion script
        run: python build_mrs.py

      - name: Commit and push generated MRS files
        run: |
          # 配置 Git 提交者信息为 GitHub Actions Bot
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 添加生成的文件夹
          git add mrs_rules_sp/
          
          # 如果有文件变更则提交，没有变更则静默退出避免报错
          git commit -m "Auto-generate MRS rules via mihomo" || exit 0
          
          # 推送回当前分支
          git push
