name: 构建或脚本问题
description: 报告规则构建、解析、转换或自动化异常
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    attributes:
      label: 问题描述
      description: 请说明发生了什么。
    validations:
      required: true

  - type: input
    attributes:
      label: 规则组
      placeholder: AI / Reject_Ads / Direct_CN
    validations:
      required: false

  - type: input
    attributes:
      label: 规则源 URL
    validations:
      required: false

  - type: textarea
    attributes:
      label: 构建日志
      description: 请粘贴相关 build_mrs_zh.log 内容。
    validations:
      required: false

  - type: textarea
    attributes:
      label: 预期结果
    validations:
      required: true
